[package]
name = "waypoint-core"
version = "0.1.0"
edition = "2021"
description = "Trip files, costs, checks and the phone itinerary for Waypoint"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { version = "0.2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
